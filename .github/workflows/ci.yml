name: CI

on:
  workflow_dispatch:  # adds a manual "Run workflow" button
  push:
    branches: [ Dev, main ]
  pull_request:
    branches: [ Dev, main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # The rig's hardware libraries (Tobii, OBS, audio, BLE) only install on the lab
      # PCs; the tests that run here need paramiko and pytest alone.
      - run: pip install pytest paramiko
      - run: pytest tests -q
